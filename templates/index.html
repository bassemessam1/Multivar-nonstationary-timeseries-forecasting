<!DOCTYPE html>
<html>
<head>
    <title>Model Selection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input {
            padding: 8px;
            width: 200px;
        }
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #dynamicFields {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Model Selection</h1>
    
    {% if error %}
        <div style="color: red; margin-bottom: 15px;">{{ error }}</div>
    {% endif %}
    
    <form id="modelForm" method="POST" action="/predict">
        <!-- Prediction Type -->
        <div class="form-group">
            <label for="prediction_type">Prediction Type:</label>
            <select id="prediction_type" name="prediction_type" required>
                <option value="">-- Select --</option>
                {% for option in options.prediction_types %}
                    <option value="{{ option }}">{{ option }}</option>
                {% endfor %}
            </select>
        </div>
        
        <!-- Architecture -->
        <div class="form-group">
            <label for="architecture">Architecture:</label>
            <select id="architecture" name="architecture" required>
                <option value="">-- Select --</option>
                {% for option in options.architectures %}
                    <option value="{{ option }}">{{ option }}</option>
                {% endfor %}
            </select>
        </div>
        
        <!-- Dataset -->
        <div class="form-group">
            <label for="dataset">Dataset:</label>
            <select id="dataset" name="dataset" required>
                <option value="">-- Select --</option>
                {% for option in options.datasets %}
                    <option value="{{ option }}">{{ option }}</option>
                {% endfor %}
            </select>
        </div>
        
        <!-- Dynamic Fields -->
        <div id="dynamicFields">
            <!-- Will be populated by JavaScript -->
        </div>
        
        <button type="submit">Predict</button>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Set up event listeners
            document.getElementById('prediction_type').addEventListener('change', updateOptions);
            document.getElementById('dataset').addEventListener('change', updateOptions);
            
            // Initial update
            updateOptions();
        });

        function updateOptions() {
            const predictionType = document.getElementById('prediction_type').value;
            const dataset = document.getElementById('dataset').value;
            
            if (!predictionType || !dataset) {
                document.getElementById('dynamicFields').innerHTML = '';
                return;
            }
            
            fetch('/get_options', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    prediction_type: predictionType,
                    dataset: dataset
                })
            })
            .then(response => response.json())
            .then(data => {
                const dynamicFields = document.getElementById('dynamicFields');
                let html = '';
                
                if (predictionType === 'single') {
                    html = `
                        <div class="form-group">
                            <label for="window">Window Size:</label>
                            <select id="window" name="window" required>
                                ${data.window_options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Horizon:</label>
                            <input type="text" value="1" readonly>
                            <input type="hidden" name="horizon" value="1">
                        </div>
                    `;
                } else {
                    html = `
                        <div class="form-group">
                            <label>Window Size:</label>
                            <input type="text" value="${data.fixed_window}" readonly>
                            <input type="hidden" name="window" value="${data.fixed_window}">
                        </div>
                        <div class="form-group">
                            <label for="horizon">Horizon:</label>
                            <select id="horizon" name="horizon" required>
                                ${data.horizon_options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                            </select>
                        </div>
                    `;
                }
                
                dynamicFields.innerHTML = html;
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
